name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # The scaffolded project must stay runnable; a broken generator is
      # invisible to the unit tests but breaks every new user.
      - name: Scaffold smoke test
        run: |
          bun link
          cd "$(mktemp -d)"
          bun "$GITHUB_WORKSPACE/src/cli/index.ts" startproject smoke
          cd smoke
          sed -i 's|"angusjs": "\^0.1.0"|"angusjs": "link:angusjs"|' package.json
          bun install
          bun "$GITHUB_WORKSPACE/src/cli/index.ts" startapp thing
          bun "$GITHUB_WORKSPACE/src/cli/index.ts" generate crud thing Widget name:string price:int

          # `check` passing is not enough on its own: an app that exists on disk
          # but was never installed reports a perfectly clean project, because
          # from `check`'s point of view there is nothing there. Assert that the
          # models and routes actually arrived.
          bun "$GITHUB_WORKSPACE/src/cli/index.ts" check | tee check.txt
          grep -q "2 model(s)" check.txt || { echo "app or model not registered"; exit 1; }

          bun "$GITHUB_WORKSPACE/src/cli/index.ts" makemigrations
          bun "$GITHUB_WORKSPACE/src/cli/index.ts" migrate

          # The generator appends code and imports to files it did not write, so
          # what matters is that the project still compiles afterwards.
          bunx tsc --noEmit
